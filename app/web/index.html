<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/xterm/xterm.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="scr" id="scr" data-style="a">
  <div class="app">
    <header class="top">
      <div class="brand"><span class="mark">&gt;_</span>Sessions</div>
      <div class="tally" id="tally" aria-live="polite"></div>
      <div class="sp"></div>
      <button class="btn" id="btnNext" data-act="next">Next needing you<kbd>⌘J</kbd></button>
      <button class="switch" id="btnDnd" data-act="dnd" role="switch" aria-checked="false"><span class="knob"></span>Do not disturb</button>
      <button class="btn primary" data-act="new">New session<kbd>⌘N</kbd></button>
      <div class="styleseg" id="styleSeg" role="radiogroup" aria-label="Styling">
        <button data-act="style" data-style="a" role="radio">Lavender</button><button data-act="style" data-style="b" role="radio">Log</button><button data-act="style" data-style="c" role="radio">Slate</button>
      </div>
      <button class="btn icon" data-act="settings" title="Settings (⌘,)" aria-label="Settings"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 5.4a2.6 2.6 0 1 0 0 5.2 2.6 2.6 0 0 0 0-5.2Zm5.6 3.5.1-.9-.1-.9 1.3-1-1.3-2.2-1.5.6a5 5 0 0 0-1.5-.9L10.3 2H7.7l-.3 1.6c-.6.2-1 .5-1.5.9l-1.5-.6L3.1 6.1l1.3 1-.1.9.1.9-1.3 1 1.3 2.2 1.5-.6c.5.4.9.7 1.5.9l.3 1.6h2.6l.3-1.6c.6-.2 1-.5 1.5-.9l1.5.6 1.3-2.2Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg></button>
    </header>
    <div class="body">
      <nav class="list" id="list" aria-label="Sessions">
        <button class="l-all" id="allAct" data-act="feed"><span class="ico"><i></i><i></i><i></i></span>All activity<span class="r-new" id="allBadge" hidden></span></button>
        <div id="listItems"></div>
      </nav>
      <main class="center" id="center">
        <div class="feedview" id="feedView">
          <section class="lane" aria-label="Waiting on you">
            <div class="lane-head"><h2>Waiting on you</h2><span class="n" id="laneN"></span><span class="hint">Longest wait first</span></div>
            <div class="lane-cards" id="laneCards"></div>
            <p class="lane-empty" id="laneEmpty" hidden>Nothing is waiting on you. New asks and finished turns land here.</p>
          </section>
          <div class="feedwrap" id="feedwrap">
            <div class="pillbar"><button class="newpill" id="newPill" data-act="pill" hidden></button></div>
            <div class="feed-tools" id="feedTools"></div>
            <div class="evlist" id="evlist" aria-live="off"></div>
            <p class="feed-empty" id="feedEmpty" hidden>No events match these filters yet.</p>
          </div>
        </div>
        <div class="sv" id="sessionView" hidden></div>
      </main>
      <aside class="tray" id="tray" aria-label="Terminals">
        <div class="tray-h">Terminals <span id="trayN" style="font-family:var(--mono);font-weight:400"></span></div>
        <div class="tray-list" id="trayList"></div>
        <button class="tray-new" data-act="newTerminal">New terminal</button>
      </aside>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div id="modalRoot"></div>
</div>

<script src="vendor/xterm/xterm.js"></script>
<script src="vendor/xterm/addon-fit.js"></script>
<script src="js/backend.js"></script>
<script src="js/terminals.js"></script>
<script src="js/app.js"></script>
</body>
</html>
